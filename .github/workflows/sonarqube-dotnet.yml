# Vendored copy of autoguru-au/devsecops/.github/workflows/sonarqube-dotnet.yml@f3f1f1cf54a1e637b5d8097ed7e9b1c49bd4d162 (COM-108).
# devsecops is private and GitHub does not let public repositories call its reusable workflows.
name: SonarQube Analysis (.NET)

on:
  workflow_call:
    inputs:
      enable_tests:
        required: false
        type: boolean
        default: true
      # Fallback only. The SDK version normally comes from the repo's global.json (see
      # the "Detect global.json" step); this is used solely when no SDK-pinning
      # global.json is found on the walk from the solution dir up to the repo root.
      dotnet_version:
        required: false
        type: string
        default: 10.0.x
      # Larger runners are not available to public repositories, so public callers
      # (kv-push, hotchocolate-polymorphic-ids) pass `ubuntu-latest`. The default keeps
      # the existing runner for private callers such as autoguru.
      runs_on:
        required: false
        type: string
        default: ubuntu-latest-m
    secrets:
      SONAR_HOST_URL:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: Analyze .NET with SonarQube
    runs-on: ${{ inputs.runs_on }}

    steps:
      # Clean up disk space before starting
      - name: Clean up disk space (start)
        run: |
          sudo rm -rf /tmp/*
          sudo rm -rf ~/.dotnet
          sudo rm -rf ~/.nuget
          sudo apt-get clean

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Resolve the SDK version the way the .NET SDK itself does: start from the
      # directory of the solution under analysis and walk up to the repo root, taking
      # the first global.json that actually pins an SDK. This lets the .NET version
      # track the repo's global.json rather than being hard-coded here (which would
      # need bumping every upgrade). We match on the `sdk` key because a repo may keep
      # a second global.json (e.g. a root copy carrying only a `test` runner block) that
      # must not be mistaken for the pin. If nothing is found we fall back to the
      # dotnet_version input below.
      - name: Detect global.json
        id: detect_globaljson
        run: |
          SLN=$(find . -name '*.slnx' | head -n 1)
          if [ -z "$SLN" ]; then
            SLN=$(find . -name '*.sln' | head -n 1)
          fi
          DIR=$(dirname "${SLN:-.}")
          GLOBAL_JSON=""
          while true; do
            if [ -f "$DIR/global.json" ] && grep -q '"sdk"' "$DIR/global.json"; then
              GLOBAL_JSON="$DIR/global.json"
              break
            fi
            if [ "$DIR" = "." ] || [ "$DIR" = "/" ]; then
              break
            fi
            DIR=$(dirname "$DIR")
          done
          if [ -n "$GLOBAL_JSON" ]; then
            echo "Using SDK pin from $GLOBAL_JSON"
          else
            echo "No SDK-pinning global.json found; falling back to dotnet-version ${{ inputs.dotnet_version }}"
          fi
          echo "GLOBAL_JSON=$GLOBAL_JSON" >> $GITHUB_OUTPUT

      # Setup .NET from the detected global.json when one was found...
      - name: Setup .NET (from global.json)
        if: steps.detect_globaljson.outputs.GLOBAL_JSON != ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.detect_globaljson.outputs.GLOBAL_JSON }}

      # ...otherwise fall back to the dotnet_version input.
      - name: Setup .NET (fallback version)
        if: steps.detect_globaljson.outputs.GLOBAL_JSON == ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      # Install SonarScanner
      - name: Install Sonar Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Coverlet.Console
        if: inputs.enable_tests == true
        run: dotnet tool install --global coverlet.console

      # Detect Solution File: .slnx is preferred; .sln is still accepted because the
      # public callers (kv-push, hotchocolate-polymorphic-ids) have not migrated.
      - name: Detect Solution File
        id: detect_solution
        run: |
          SOLUTION_FILE=$(find . -name '*.slnx' | head -n 1)
          if [ -z "$SOLUTION_FILE" ]; then
            SOLUTION_FILE=$(find . -name '*.sln' | head -n 1)
          fi
          if [ -z "$SOLUTION_FILE" ]; then
            echo "❌ No .slnx or .sln solution file found! Make sure your repository has one."
            exit 1
          fi
          echo "SOLUTION_FILE=$SOLUTION_FILE" >> $GITHUB_ENV

     # Create Temporary Solution (if tests are disabled)
      - name: Create Temporary Solution (Exclude Tests)
        if: inputs.enable_tests == false
        run: |
          echo "Creating temporary solution excluding test and problematic projects..."
          dotnet new sln -n TempSolution -o ./ --format slnx --force
          PROJECTS=$(find ./src -name '*.csproj' | grep -vE '/test/|/tests/|.*Test.*.csproj|AutoGuru.AirwallexClient.csproj|AutoGuru.Stripe.Client.csproj|AutoGuru.ThirdPartyIntegrationDocs.csproj')
          if [ -z "$PROJECTS" ]; then
            echo "⚠️ No non-test projects found to add to TempSolution."
            exit 1
          fi
          echo "$PROJECTS" | xargs dotnet sln ./TempSolution.slnx add
      
      - name: Restore Dependencies
        run: |
          if [ "${{ inputs.enable_tests }}" == "true" ]; then
            dotnet restore ${{ env.SOLUTION_FILE }}
          else
            dotnet restore ./TempSolution.slnx --no-cache
          fi

      - name: Build Tests
        if: inputs.enable_tests == true
        run: |
          TEST_PROJECT=$(find ./ -name '*.csproj' | grep -E '/test/|/tests/|.*Test.*.csproj' | head -n 1)
          if [ -z "$TEST_PROJECT" ]; then
            echo "❌ No test project found! Skipping test build."
            exit 1
          fi
          dotnet build $TEST_PROJECT --configuration Debug
  
      - name: Run Tests with Coverage
        if: inputs.enable_tests == true
        run: |
          TEST_PROJECT=$(find ./ -name '*.csproj' | grep -E '/test/|/tests/|.*Test.*.csproj' | head -n 1)
          if [ -z "$TEST_PROJECT" ]; then
            echo "❌ No test project found! Skipping tests."
            exit 1
          fi
          TEST_DLL=$(find ./ -name '*.dll' | grep -E '/bin/Debug/net[0-9]+\.[0-9]+/' | grep 'Test' | head -n 1)
          if [ -z "$TEST_DLL" ]; then
            echo "❌ No test DLL found! Skipping coverage."
            exit 1
          fi
          coverlet $TEST_DLL \
            --target "dotnet" \
            --targetargs "test $TEST_PROJECT --no-build --logger trx --results-directory ./TestResults/" \
            --output ./TestResults/Coverage/coverage.opencover.xml \
            --format opencover

      - name: Upload Test Results
        if: inputs.enable_tests == true
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ./TestResults/

      # Start SonarQube Analysis
      - name: Start SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ github.event.repository.name }}" \
            /n:"${{ github.event.repository.name }}" \
            /v:"${{ github.sha }}" \
            /d:sonar.cs.opencover.reportsPaths="./TestResults/Coverage/coverage.opencover.xml" \
            /d:sonar.inclusions="**/*.cs" \
            /d:sonar.exclusions="**/bin/**,**/obj/**" \
            /d:sonar.verbose=true \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # Build Solution
      - name: Build Solution
        run: |
          if [ "${{ inputs.enable_tests }}" == "true" ]; then
            dotnet build ${{ env.SOLUTION_FILE }}
          else
            dotnet build ./TempSolution.slnx
          fi

      # Finish SonarQube Analysis
      - name: Finish SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      # Clean up disk space after workflow
      - name: Clean up disk space (end)
        run: |
          sudo rm -rf /tmp/*
          sudo rm -rf ~/.dotnet
          sudo rm -rf ~/.nuget
          sudo apt-get clean
